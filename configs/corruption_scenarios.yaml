version: 1
scenarios:
  - {id: schema_column_renamed, class: schema, description: Rename height_m to an unexpected column}
  - {id: schema_numeric_string, class: schema, description: Store a numeric height as text}
  - {id: schema_required_removed, class: schema, description: Remove the observation identifier column}
  - {id: schema_category_changed, class: schema, description: Introduce an undeclared status token}
  - {id: schema_null_identifier, class: schema, description: Null a required observation ID}
  - {id: schema_unit_removed, class: schema, description: Remove normalized height unit metadata}
  - {id: row_negative_height, class: row, description: Make a measured height negative}
  - {id: row_negative_arms, class: row, description: Make an arm count negative}
  - {id: row_impossible_coordinate, class: row, description: Set latitude beyond 90 degrees}
  - {id: row_duplicate_source, class: row, description: Append a new observation with identical source/event lineage}
  - {id: row_duplicate_observation, class: row, description: Append an exact duplicate canonical row}
  - {id: row_malformed_numeric, class: row, description: Replace height with a malformed numeric token}
  - {id: temporal_dead_to_alive, class: temporal, description: Insert an explicit death followed by explicit life}
  - {id: temporal_height_decrease, class: temporal, description: Artificially reduce a later height by 90 percent}
  - {id: temporal_positive_growth, class: temporal, description: Add 100 meters to a later height}
  - {id: temporal_arm_collapse, class: temporal, description: Set a positive prior count followed by zero arms}
  - {id: temporal_duplicate_event, class: temporal, description: Append a second organism/event measurement}
  - {id: temporal_identity_reassignment, class: temporal, description: Assign another supported organism ID}
  - {id: temporal_year_swap, class: temporal, description: Swap years without changing event identity}
  - {id: spatial_outside_plot, class: spatial, description: Move a coordinate well outside its assigned known polygon}
  - {id: spatial_crs_removed, class: spatial, description: Remove CRS from a source spatial feature}
  - {id: spatial_crs_mislabeled, class: spatial, description: Label UTM source coordinates as geographic}
  - {id: spatial_coordinates_swapped, class: spatial, description: Swap latitude and longitude}
  - {id: spatial_invalid_geometry, class: spatial, description: Replace valid feature bytes with a self-intersecting polygon}
  - {id: spatial_other_plot_coordinates, class: spatial, description: Borrow coordinates from a different known plot}
  - {id: provenance_source_row_changed, class: provenance, description: Change physical row while keeping old lineage IDs}
  - {id: provenance_sha_mismatch, class: provenance, description: Replace the source SHA with an unknown hash}
  - {id: provenance_transformation_removed, class: provenance, description: Delete the height transformation record}
  - {id: provenance_unrecorded_value, class: provenance, description: Change normalized height without updating provenance}
  - {id: provenance_duplicate_lineage, class: provenance, description: Append a canonical row with identical lineage}
